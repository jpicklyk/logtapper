project:
  rootId: "9adc7633-4cab-4acf-a789-739a6747d8df"
  name: "LogTapper"

work_item_schemas:

  feature:
    lifecycle: auto
    notes:
      - key: requirements
        role: queue
        required: true
        description: "Problem statement, acceptance criteria, and non-goals."
        guidance: "Consult .claude/skills/spec-framework/ for the full guide. State the problem with quantified impact. List 2-5 testable acceptance criteria. Name at least one non-goal (a reasonable expectation you deliberately exclude)."
        skill: "spec-framework"

      - key: design
        role: queue
        required: true
        description: "Approach, alternatives considered, affected modules."
        guidance: "Consult .claude/skills/spec-framework/ for the full guide. Describe the proposed approach and which layers it touches (Rust backend, frontend modules, MCP bridge). List 2+ real alternatives with specific trade-offs explaining why each was rejected. Identify affected files and check cross-cutting concerns (concurrency, StrictMode, frontend isolation, pre-filter). Any external API, method, trait, crate or npm package named in this note must be verified to exist in the version this project actually uses — grep the vendored source under ~/.cargo/registry/src or node_modules, or the lockfile — and the note must say where it was verified. Do not infer an API's existence from documentation, a sibling package's typical stack, or a transitive dependency's reputation."
        skill: "spec-framework"

      - key: implementation-notes
        role: work
        required: true
        description: "Decisions, deviations from design, surprises."
        guidance: "Document key decisions made during implementation that weren't in the design. Note any deviations from the plan and why. Record surprises, wrong turns, and reusable patterns discovered. This is not a git log — explain the why, not the what. Target 500 tokens (~2,000 chars). Lead with the decisions and deviations; one line per finding, not a walkthrough. Verbatim artifacts — full test output, diffs, per-finding evidence — belong in a file passed as bodyFromFile, not inline. If the note must run long, say why in its first line."

      - key: test-results
        role: work
        required: true
        description: "Test pass/fail counts, new tests added, manual verification."
        guidance: "Report cargo test results (count, pass/fail), clippy status, and npm run build status. List any new tests by name. For UI changes, describe manual verification performed. Distinguish pre-existing failures from new ones."

      - key: session-tracking
        role: work
        required: true
        description: "Session context for retrospective."
        guidance: "Record outcome, files changed, deviations from plan, friction encountered, and test results. This feeds /session-retrospective — focus on what future sessions need to know."

      - key: delegation-metadata
        role: work
        required: true
        description: "Per-dispatch model, isolation, rationale and outcome."
        guidance: "One entry per dispatch on this item, implementation AND review, in order: model, isolation (inline/worktree), why that model was chosen, outcome, and approximate tokens / tool uses / wall clock. A secondary, re-run or feature-level review dispatch counts as its own entry."

      - key: live-smoke
        role: work
        required: true
        description: "CDP-driven smoke on a production build before merge."
        guidance: "Drive the built app (not the dev server) over CDP and walk the user-visible path each acceptance criterion claims. Record what was exercised, what passed, and anything observed but out of scope. If a smoke was deliberately skipped, say why here - the note is required, a skip is not."

      - key: review-checklist
        role: review
        required: true
        description: "Structured review — plan alignment, test quality, simplification."
        guidance: "Run the review-quality framework. Verify all acceptance criteria from the requirements note are met in code. Check test substance against the test strategy — flag tautological assertions, mock-only tests, or missing edge cases. Two negative examples to flag: (a) a test asserting a narrow helper does not call something it structurally cannot call; (b) a test that reimplements the unit-under-test's own logic against a mock instead of exercising the real component. Run /simplify on changed files and document findings. Verdict: pass, fail (with blocking issues list), or pass-with-observations. Target 500 tokens (~2,000 chars). Lead with the decisions and deviations; one line per finding, not a walkthrough. Verbatim artifacts — full test output, diffs, per-finding evidence — belong in a file passed as bodyFromFile, not inline. If the note must run long, say why in its first line."

  feature-task:
    lifecycle: auto
    notes:
      - key: task-scope
        role: queue
        required: true
        description: "What to build — target files, acceptance criteria, constraints."
        guidance: "Define the narrow scope. Include: what to build, target files, acceptance criteria, constraints. The parent feature spec covers the 'why' — don't repeat it here. Map the interaction surface: list every existing code path that reads or writes state you will touch (effects, callbacks, reset/cleanup paths, callers with different parameter combinations). The implementation must account for all of them."

      - key: implementation-notes
        role: work
        required: true
        description: "Context handoff — deviations, surprises, decisions affecting dependent work."
        guidance: "Document decisions not in the task scope. Focus on what downstream agents or the next session needs to know. Target 500 tokens (~2,000 chars). Lead with the decisions and deviations; one line per finding, not a walkthrough. Verbatim artifacts — full test output, diffs, per-finding evidence — belong in a file passed as bodyFromFile, not inline. If the note must run long, say why in its first line."

      - key: session-tracking
        role: work
        required: true
        description: "Session context for retrospective."
        guidance: "Record outcome, files changed, deviations, friction, test results."

      - key: review-checklist
        role: review
        required: true
        description: "Task-level quality gate — scope alignment and test coverage."
        guidance: "Verify scope alignment, test coverage, no unintended side effects. Two negative examples to flag: (a) a test asserting a narrow helper does not call something it structurally cannot call; (b) a test that reimplements the unit-under-test's own logic against a mock instead of exercising the real component. No /simplify here — that happens at the parent feature level."

  bug-fix:
    lifecycle: auto
    notes:
      - key: reproduction-steps
        role: queue
        required: true
        description: "Step-by-step reproduction with expected vs actual result."
        guidance: "Include the exact steps or tool call that triggers the bug. State expected output and actual output. Note environment details if relevant (Windows/MSYS2 gotchas, StrictMode double-mount, etc.)."

      - key: root-cause
        role: queue
        required: true
        description: "Why it happens — file, line, and condition."
        guidance: "Identify the specific file and function. Explain the condition that triggers it. Reference CLAUDE.md gotchas if applicable (Rhai scripting, pre-filter, LineContext Arc<str>, etc.). Map the interaction surface: list every code path that reads or writes the affected state (effects, callbacks, reset/cleanup paths, external callers with different parameter combinations). The fix must account for all of them, not just the direct call path. Any external API, method, trait, crate or npm package named in this note must be verified to exist in the version this project actually uses — grep the vendored source under ~/.cargo/registry/src or node_modules, or the lockfile — and the note must say where it was verified. Do not infer an API's existence from documentation, a sibling package's typical stack, or a transitive dependency's reputation."

      - key: fix-summary
        role: work
        required: true
        description: "What was changed and which files were modified."
        guidance: "List each file changed and summarize the change. Note if the fix required changes beyond the root cause location (e.g., callers, tests, types)."

      - key: test-verification
        role: work
        required: true
        description: "How the fix was verified and test results after fix."
        guidance: "Run tests and report results. Note if a new test was added to cover the fix. For UI bugs, describe manual verification performed."

      - key: session-tracking
        role: work
        required: true
        description: "Session context for retrospective."
        guidance: "Record outcome, files changed, deviations from plan, friction encountered, and test results. This feeds /session-retrospective -- focus on what future sessions need to know."

      - key: live-smoke
        role: work
        required: true
        description: "CDP-driven smoke on a production build before merge."
        guidance: "Drive the built app (not the dev server) over CDP and walk the user-visible path each acceptance criterion claims. Record what was exercised, what passed, and anything observed but out of scope. If a smoke was deliberately skipped, say why here - the note is required, a skip is not."

      - key: review-summary
        role: review
        required: true
        description: "Review the fix — root cause addressed, regression coverage, no side effects."
        guidance: "Run the review-quality framework. Verify the fix addresses the root cause identified in the root-cause note, not just the symptom. Check that test-verification covers the exact failure scenario from reproduction-steps. Look for unintended side effects in adjacent code paths. Run /simplify on changed files. Verdict: pass, fail (with blocking issues list), or pass-with-observations. Target 500 tokens (~2,000 chars). Lead with the decisions and deviations; one line per finding, not a walkthrough. Verbatim artifacts — full test output, diffs, per-finding evidence — belong in a file passed as bodyFromFile, not inline. If the note must run long, say why in its first line."

  container:
    lifecycle: permanent
    notes:
      - key: container-summary
        role: queue
        required: false
        description: "Optional high-level description of what this container organizes."
        guidance: "Brief description of the container's purpose and scope. Not required — containers exist to group work items, not to carry implementation detail."

  # Matched by the `improvement-proposal` tag (project-scoped proposals live
  # under this root). Declared so those items resolve here rather than to the
  # `default` schema below, whose work-phase notes they never carry.
  improvement-proposal:
    lifecycle: auto
    notes:
      - key: proposal
        role: queue
        required: false
        description: "The proposed change, its scope (global or project), and the trend that graduated it."

      - key: adoption-decision
        role: work
        required: true
        description: "accepted / rejected / deferred, with rationale and where the change was applied or tracked."

      - key: outcome-verification
        role: review
        required: true
        description: "Filled by a later retrospective: did the applied change demonstrably help?"

  # Every item with no matching type or tag schema (tech-debt, reference,
  # ad-hoc). No review phase; the two work notes are what a future session
  # cannot derive from git.
  default:
    lifecycle: auto
    notes:
      - key: implementation-notes
        role: work
        required: true
        description: "Decisions, deviations, surprises — what a future session cannot derive from git."
        guidance: "Applies to every item without a matching type or tag schema. Keep it to what the next session needs: why, not what."

      - key: session-tracking
        role: work
        required: true
        description: "Session context for retrospective."
        guidance: "Record outcome, files changed, deviations from plan, friction encountered, and test results. This feeds /session-retrospective."
