<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogTapper (Solid)</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Synchronous theme bootstrap — prevents FOUC on cold start. Externalized
         (rather than inline) so it is covered by `script-src 'self'` with no
         CSP exception; see src-solid/public/theme-bootstrap.js and
         src-tauri/src/CLAUDE.md's CSP section. Reads the same
         'logtapper-theme' key as src-solid/theme/applyTheme.ts's
         createThemeController (and src-next/context/ThemeContext.tsx's
         STORAGE_KEY), so both UIs resolve to the same theme. -->
    <script src="/theme-bootstrap.js"></script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
