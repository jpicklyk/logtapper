<!--
  LogTapper redesign canvas — shared foundation (NOT an artboard; copy into each *.dc.html).
  Tokens lifted from src-next/styles/tokens.css (dark + light), Geist UI / mono viewer.

  Pattern per artboard:
    <div class="theme-{{theme}}" style="...root...">   one tweak: theme = dark | light
  All colours inside the board are literal `var(--token)` references so the properties
  panel can still restyle any element, while the theme tweak swaps the whole palette.
-->
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: var(--accent); } a:hover { color: var(--accent-base); }
    * { box-sizing: border-box; }

    /* ---- palette: dark (primary) ---- */
    .theme-dark {
      --bg-base: #0c1014; --bg-raised: #141b21; --bg-overlay: #1b2530; --bg-input: #0e1318;
      --border: #243040; --border-subtle: #2d3d4e;
      --text: #b8c4ce; --text-subtle: #9faab4; --text-muted: #8b949e; --text-dimmed: #484f58;
      --accent: #58a6ff; --accent-base: #1f6feb; --accent-muted: rgba(88,166,255,0.12); --accent-border: rgba(88,166,255,0.25);
      --danger: #f85149; --danger-muted: rgba(248,81,73,0.12);
      --success: #3fb950; --success-muted: rgba(63,185,80,0.14);
      --warning: #d29922; --warning-muted: rgba(210,153,34,0.12);
      --brand: #e2383d; --android: #ff6128;
      --level-verbose: #6e7b8b; --level-debug: #9faab4; --level-info: #b8c4ce; --level-warning: #d29922; --level-error: #f47067; --level-fatal: #ff6e6e;
      --level-warning-bg: rgba(210,153,34,0.08); --level-error-bg: #2d1117; --level-fatal-bg: #3d1118;
      --active-line: rgba(255,255,255,0.04); --selection: rgba(88,166,255,0.2);
      --match: rgba(210,153,34,0.35); --pii: rgba(226,56,61,0.22);
      --agent-idle: #7c8ea3; --agent-reading: #58a6ff; --agent-running: #3fb950; --agent-wrote: #c9a227; --agent-needs: #f0a500; --agent-raw: #f85149;
      --caller-human: #7c8ea3; --caller-agent: #58a6ff;
      --shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    /* ---- palette: light ---- */
    .theme-light {
      --bg-base: #ffffff; --bg-raised: #e9ecf0; --bg-overlay: #dce0e6; --bg-input: #f2f4f7;
      --border: #b8c2cc; --border-subtle: #c8d0d8;
      --text: #1a1f26; --text-subtle: #4b5563; --text-muted: #5d6672; --text-dimmed: #8b95a1;
      --accent: #0969da; --accent-base: #0550ae; --accent-muted: rgba(9,105,218,0.10); --accent-border: rgba(9,105,218,0.20);
      --danger: #cf222e; --danger-muted: rgba(207,34,46,0.10);
      --success: #1a7f37; --success-muted: rgba(26,127,55,0.12);
      --warning: #9a6700; --warning-muted: rgba(154,103,0,0.10);
      --brand: #d42f34; --android: #ff6128;
      --level-verbose: #8c959f; --level-debug: #57606a; --level-info: #1a1f26; --level-warning: #9a6700; --level-error: #cf222e; --level-fatal: #a40e26;
      --level-warning-bg: rgba(154,103,0,0.08); --level-error-bg: rgba(207,34,46,0.05); --level-fatal-bg: rgba(164,14,38,0.06);
      --active-line: rgba(0,0,0,0.03); --selection: rgba(9,105,218,0.2);
      --match: rgba(154,103,0,0.28); --pii: rgba(212,47,52,0.18);
      --agent-idle: #6b7a8c; --agent-reading: #0969da; --agent-running: #1a7f37; --agent-wrote: #7d4e00; --agent-needs: #b35c00; --agent-raw: #cf222e;
      --caller-human: #6b7a8c; --caller-agent: #0969da;
      --shadow: 0 8px 24px rgba(16,24,40,0.16);
    }
    /* ---- type & motion ---- */
    .theme-dark, .theme-light {
      --font-ui: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      font-family: var(--font-ui); color: var(--text); font-size: 13px; line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    @keyframes lt-breathe { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.06); opacity: 1 } }
    @keyframes lt-scan { 0% { background-position: 0 0 } 100% { background-position: 0 -40px } }
    @keyframes lt-pulse { 0%,100% { box-shadow: 0 0 0 0 var(--agent-needs) } 50% { box-shadow: 0 0 0 10px rgba(240,165,0,0) } }
  </style>
</helmet>

<!-- COMPONENT RECIPES (inline styles so the panel can edit them)
  chip:      <span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:9999px;border:1px solid var(--border);background:var(--bg-raised);font-size:12px;color:var(--text-subtle)">…</span>
  chip-on:   border:1px solid var(--accent-border);background:var(--accent-muted);color:var(--accent)
  button:    <button style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-raised);color:var(--text);font:500 12px var(--font-ui);cursor:pointer">…</button>
  primary:   border-color:var(--accent-base);background:var(--accent-base);color:#fff
  card:      <div style="border:1px solid var(--border);border-radius:8px;background:var(--bg-raised);padding:12px 14px">…</div>
  section h: <div style="font:600 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);padding:10px 12px 6px">…</div>
  caller badge (agent): <span style="display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:9999px;background:var(--accent-muted);color:var(--caller-agent);font:500 11px var(--font-ui)">◆ agent</span>  (use the spark svg instead of ◆)
  caller badge (you):   background:var(--bg-overlay);color:var(--caller-human)
  viewer row: <div style="display:grid;grid-template-columns:72px 24px minmax(0,1fr);height:22px;align-items:center;font:13px/22px var(--font-mono)">
                <span style="color:var(--text-dimmed);text-align:right;padding-right:10px">48213</span>
                <span style="color:var(--level-warning);font-weight:500">W</span>
                <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--level-warning)">10:00:01.767  7513  7561 UsbDeviceManager: …</span>
              </div>
  active row: background:var(--active-line)   cursor row: box-shadow: inset 2px 0 var(--accent)
  agent orb:  <div style="width:28px;height:28px;border-radius:9999px;background:radial-gradient(circle at 35% 35%, var(--agent-reading), transparent 70%), var(--bg-overlay);border:1px solid var(--accent-border);animation:lt-breathe 3s ease-in-out infinite"></div>
              states: swap the gradient colour for --agent-idle / --agent-running / --agent-wrote / --agent-needs (+ animation lt-pulse) / --agent-raw
-->
