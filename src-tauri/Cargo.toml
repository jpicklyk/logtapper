[package]
name = "log-tapper"
version = "0.13.2"
description = "Android log file analyzer with AI-assisted analysis"
edition = "2021"
# Bumped from 1.77.2 for ts-rs 11.1.0 (its own rust-version is 1.78.0).
rust-version = "1.78.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Compiles `services::testing` (RecordingSink, `test_ctx()`, session fixtures)
# into the rlib so integration tests under `src-tauri/tests/` can build a
# Tauri-free `ServiceCtx` the same way the inline unit tests do. Off by default:
# it pulls test doubles into a normal build for no benefit.
test-support = []

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# TypeScript binding generation (see src-tauri/tests/export_bindings.rs).
# Export dir comes from TS_RS_EXPORT_DIR in the root .cargo/config.toml.
ts-rs = { version = "11", default-features = false, features = [
    "serde-compat",
    "serde-json-impl",
    "no-serde-warnings",
] }

# Logging
log = "0.4"

# Phase 1: File I/O and parsing
memmap2 = "0.9"
memchr = "2"
regex = "1.11"
tauri-plugin-dialog = "2.6.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

# Phase 2: Scripting and YAML
rhai = { version = "1", features = ["sync"] }
serde_yaml = "0.9"

# Phase 4: Claude API (HTTP + async) + registry
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
rayon = "1"
aho-corasick = "1"
smallvec = "1"

# MCP bridge — local HTTP server for AI agent tool access
axum = "0.8"

# Versioning
semver = "1"

# Phase 2: Bookmarks + Analysis
uuid = { version = "1", features = ["v4"] }

# Single instance enforcement (second launch redirects to existing window)
tauri-plugin-single-instance = "2"

# Window state persistence (saves position/size across restarts)
tauri-plugin-window-state = "2"

# Opening external URLs in the OS default handler. Markdown prose (including
# analyses published by an MCP agent) can contain http/https/mailto links; the
# navigation guard in `webview_guard.rs` refuses to let the webview follow them, so
# the frontend hands them to this plugin instead. Scoped to `opener:allow-open-url`
# in `capabilities/default.json` — no `open_path`, no `reveal_item_in_dir`.
tauri-plugin-opener = "2"

# In-app updates over GitHub Releases. Bundles are verified against the minisign
# public key in tauri.conf.json (`plugins.updater.pubkey`); the matching private
# key exists only as a CI secret and in the maintainer's password manager. Driven
# from `commands/app_update.rs`, not the plugin's JS API, so the app's own exit
# cleanup runs before the installer. `time` formats the manifest's publish date
# (the plugin already depends on it). Release steps: README.md "Releasing".
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# `test-util` enables tokio::time::pause / #[tokio::test(start_paused = true)]
# used by the Q4 auto-save debounce tests in workspace/autosave.rs.
tokio = { version = "1", features = ["full", "test-util"] }
# In-process HTTP harness for the MCP bridge router (see
# src-tauri/tests/bridge_http.rs) — drives `mcp_bridge::router(ctx)` with
# `tower::ServiceExt::oneshot` instead of binding a real TCP listener.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Self-dependency so `cargo test` (no extra flags) links `services::testing`
# into the integration-test build: that module is `cfg(any(test, feature =
# "test-support"))`, and `#[cfg(test)]` on the lib crate itself is NOT visible
# to a separate integration-test crate — only the `test-support` feature is.
# Declaring it here activates the feature during feature unification for the
# `cargo test` build without requiring every contributor to remember
# `--features test-support`. NOTE: this makes `tests/bridge_http.rs` COMPILE
# and LINK under plain `cargo test` — see `implementation-notes` on this work
# item for a separate, unrelated Windows/MSVC runtime issue that currently
# makes the resulting test binary crash at OS load (not a build problem).
log-tapper = { path = ".", features = ["test-support"] }

[lints.clippy]
# === Deny (safety-critical, zero tolerance) ===
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
perf = { level = "deny", priority = -1 }

# === Warn (code quality — prevent regressions) ===
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
unused_async = "warn"
wildcard_imports = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
macro_use_imports = "warn"
manual_string_new = "warn"
inefficient_to_string = "warn"

# === Warn (auto-fixable) ===
uninlined_format_args = "warn"
redundant_closure_for_method_calls = "warn"
redundant_clone = "warn"
explicit_iter_loop = "warn"
or_fun_call = "warn"
needless_collect = "warn"
semicolon_if_nothing_returned = "warn"

# === Warn (manual fixes — Phase 2) ===
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
suboptimal_flops = "warn"
